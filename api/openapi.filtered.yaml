  /api/support/tickets/:
    get:
      operationId: support_tickets_list
      description: 'Tickets de soporte.


        Self-service (cualquier BranchUser activo):

        - list / retrieve / create / submit de tickets propios (requester=user)

        - no exige permiso de escritura en ``config``


        Gestión (escritura en ``config``):

        - ver/editar todos los tickets de la sucursal

        - assign / close / cancel / stats / etc.'
      summary: Listar tickets
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: string
          format: uuid
      - in: query
        name: branch
        schema:
          type: integer
      - in: query
        name: category
        schema:
          type: string
          format: uuid
      - in: query
        name: client
        schema:
          type: integer
      - in: query
        name: created_date
        schema:
          type: string
          format: date-time
      - in: query
        name: due_date
        schema:
          type: string
          format: date-time
      - in: query
        name: format
        schema:
          type: string
          enum:
          - binary
          - json
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          x-spec-enum-id: da9c411939068944
          title: Prioridad
          enum:
          - CRITICAL
          - HIGH
          - LOW
          - MEDIUM
        description: '* `LOW` - Baja

          * `MEDIUM` - Media

          * `HIGH` - Alta

          * `CRITICAL` - Crítica'
      - in: query
        name: requester
        schema:
          type: integer
