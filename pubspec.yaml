  flutter_local_notifications: ^19.0.0
  flutter_map: ^8.1.1
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^3.0.0
  go_router: ^16.2.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  latlong2: ^0.9.1
  nereus_api_client:
