name: nereus_app
description: Nereus / SmartHydro — telemetría hídrica, alertas y soporte.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  collection: ^1.19.1
  connectivity_plus: ^6.1.4
  dio: ^5.8.0+1
  drift: ^2.26.0
  drift_flutter: ^0.2.4
